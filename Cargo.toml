[package]
name = "rawb-io"
version = "0.1.0"
authors = ["Tim Fennell <tfenne@tfenne.com>"]
description = "Read-ahead / write-behind byte IO: threaded Reader/Writer that decouples a pipeline stage from the kernel pipe via a background thread and a byte ring buffer."
edition = "2024"
rust-version = "1.89"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/tfenne/rawb-io"
repository = "https://github.com/tfenne/rawb-io"
keywords = ["io", "buffer", "thread", "spsc", "pipe"]
# "asynchronous" deliberately absent: that category is for async-runtime IO,
# and this crate is threaded synchronous IO.
categories = ["concurrency"]
# Keep CI and maintainer tooling out of the published tarball; what remains
# (src, README, CHANGELOG, LICENSE) is what a user of the crate needs.
exclude = [
    "/.cargo",
    "/.config",
    "/.github",
    "/CLAUDE.md",
    "/CONTRIBUTING.md",
    "/deny.toml",
    "/release.toml",
    "/rust-toolchain.toml",
]

[lints.rust]
# `--cfg loom` is set only by scripts/loom.sh (model-checking builds); declare
# it so normal rustc/clippy runs don't reject the cfg under -D warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dependencies]
# 0.5.2's `Consumer::skip` is O(n) for `u8`, and every byte we move goes through it.
ringbuf = "0.5.3"

# Compiled ONLY under `RUSTFLAGS="--cfg loom"` (scripts/loom.sh): loom's
# instrumented primitives replace std's via the `sync_shim` module so the
# park/wake/latch protocols can be model-checked across all interleavings.
# Normal builds — `cargo test` included — never compile this.
[target.'cfg(loom)'.dependencies]
loom = "0.7"
