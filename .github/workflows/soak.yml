name: Soak (long-running stress)

# The #[ignore]d soak tests: multi-minute deadlock/race/backpressure grinds
# that would slow every PR but should still run regularly. Weekly + on
# demand. A hung soak is killed and failed by nextest's terminate-after
# (see .config/nextest.toml's soak profile).

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install nextest
        uses: taiki-e/install-action@e4b21e1a4de672bc0de96fc2afab9d8081b1d622 # nextest
      - name: Soak tests
        run: cargo ci-soak
