name: Check and Test

on:
  push:
    branches:
      - main
  pull_request:

# A force-push or rapid follow-up commit supersedes in-flight runs of the
# same ref; don't burn runners finishing stale ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # Builds and tests on the declared MSRV (Cargo.toml `rust-version`) so a PR
  # that uses a newer stdlib/API can't silently break `cargo install` for
  # MSRV users. `rust-toolchain.toml` pins `stable` for local dev, so we
  # override it for this job via `RUSTUP_TOOLCHAIN`. Lint/format stay on
  # stable (clippy/rustfmt track the latest toolchain).
  #
  # The matrix covers all three OS families: this crate is park/unpark
  # concurrency, and thread-parker and pipe semantics differ per platform.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: "1.89.0"
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Install nextest
        uses: taiki-e/install-action@e4b21e1a4de672bc0de96fc2afab9d8081b1d622 # nextest
      - name: Unit tests
        run: cargo ci-test
      - name: Doc tests
        run: cargo ci-doctest

  # Interprets a curated subset of the suite under Miri to check the crate's
  # unsafe sites (the ring-zeroing memset, the MaybeUninit cast, and the
  # bounds-checked advance_write_index) plus the park/unpark protocol for UB.
  # The subset sticks to small deterministic tests: Miri interprets every
  # memory access, so the big-payload and timing-sweep tests would take hours.
  # sccache is disabled here because cargo-miri installs its own rustc wrapper.
  miri:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain (nightly + miri)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
          components: miri
      - name: Miri tests
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: >
          cargo +nightly miri test --
          tests::threaded_reader_round_trip_small
          tests::threaded_reader_round_trip_larger_than_ring
          tests::threaded_writer_round_trip_with_finish
          tests::reader_error_latch_preserves_kind_and_is_idempotent
          tests::flush_propagates_to_the_sink
          tests::zero_length_reads_and_writes_do_not_block
          tests::eof_reads_stay_at_eof
          tests::clone_io_error_round_trips_os_errors
          tests::clone_io_error_preserves_kind_and_message
          tests::fresh_ring_vacant_slices_cover_the_whole_allocation
          tests::source_that_reads_its_buffer_is_sound_and_round_trips
      # Re-run the cheapest concurrency tests across 32 scheduling seeds so
      # Miri's data-race detector sees genuinely different interleavings, not
      # just its default deterministic schedule.
      - name: Miri tests (32 scheduling seeds)
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-many-seeds=0..32"
        run: >
          cargo +nightly miri test --
          tests::threaded_reader_round_trip_small
          tests::zero_length_reads_and_writes_do_not_block
          tests::eof_reads_stay_at_eof

  # Runs the suite under ThreadSanitizer (nightly, instrumented std) to watch
  # every atomic and lock — including ringbuf's internals — for data races at
  # runtime. Stress iteration counts are trimmed: TSan's overhead makes the
  # default sweeps needlessly slow, and the soak workflow covers volume.
  # Linux only: TSan is broken on macOS aarch64 hosts (segfaults at startup).
  # sccache is disabled because the sanitizer RUSTFLAGS defeat the cache.
  tsan:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
      RUSTFLAGS: "-Zsanitizer=thread"
      REENTRANT_STRESS_ITERS: "200"
      PANIC_MASK_STRESS_ITERS: "1000"
      ERROR_MASK_STRESS_ITERS: "1000"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain (nightly + rust-src)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
          components: rust-src
      - name: Unit tests under ThreadSanitizer
        run: cargo +nightly test --locked --lib -Zbuild-std --target x86_64-unknown-linux-gnu

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Clippy check
        run: cargo ci-lint
      # Build the publishable tarball (and compile from it) so packaging
      # problems surface on every PR instead of at release time.
      - name: Package check
        run: cargo package --locked

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: Set up compilation cache (sccache)
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - name: Rustfmt check
        run: cargo ci-fmt
